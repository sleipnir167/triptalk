<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0d0b33">
  <meta name="description" content="旅行でよく使う英単語・フレーズを、忘却曲線に合わせた復習・音声判定・AI添削で身につける旅行英会話トレーナー">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TripTalk">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@500;700&family=Great+Vibes&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/main.js">
  <title>TripTalk – 旅の英会話トレーナー</title>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <div id="splash" aria-hidden="true">
    <div class="sp-stars"></div>
    <div class="sp-inner">
      <img class="sp-logo" src="icons/icon.svg" alt="">
      <div class="sp-name">TripTalk</div>
      <div class="sp-sub">✦ a magical voyage of English ✦</div>
    </div>
  </div>
  <div id="app">
    <aside class="sidebar" aria-label="メニュー"></aside>
    <main id="view" class="view"></main>
    <nav class="tabbar" aria-label="タブ"></nav>
  </div>
  <div id="layer"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
  <script>
    // 起動の見張り：20秒たっても起動しないとき（ファイルの読み込み失敗など）は、直し方を表示する
    setTimeout(function () {
      if (window.__ttBooted || document.body.classList.contains('ready') || document.querySelector('.boot-error')) return;
      var d = document.createElement('div');
      d.className = 'boot-error';
      d.innerHTML = '<div class="be-card"><div class="be-emoji">🛠️</div><h2>起動に時間がかかっています</h2>' +
        '<p>学習データは消えていません。電波の良い場所で、下のボタンをお試しください。</p>' +
        '<button class="btn btn-primary btn-lg" id="be-reload">もう一度読み込む</button>' +
        '<button class="btn btn-soft" id="be-clean">アプリを最新に入れ直す（データは残ります）</button></div>';
      document.body.appendChild(d);
      document.getElementById('be-reload').onclick = function () { location.reload(); };
      document.getElementById('be-clean').onclick = function () {
        var done = function () { location.reload(); };
        var p = navigator.serviceWorker && navigator.serviceWorker.getRegistrations ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]);
        p.then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
          .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : null; })
          .then(done, done);
      };
    }, 20000);
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
